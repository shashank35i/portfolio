name: Validate and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:chat
      - run: npm run check
      - run: npm run build

  deploy:
    needs: validate
    # Validation remains green with no deployment credentials. Deployment is an
    # explicit opt-in for both main pushes and manual runs.
    if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing required GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Missing required GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$GROQ_API_KEY" ] || { echo "::error::Missing required GitHub secret: GROQ_API_KEY"; exit 1; }
          echo "Required deployment secrets are configured."
      - name: Sync encrypted Groq runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: printf '%s' "$GROQ_API_KEY" | npx wrangler pages secret put GROQ_API_KEY --project-name portfolio
      - name: Deploy Pages site and Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist/public --project-name portfolio --branch main
